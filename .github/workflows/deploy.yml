name: CI/CD — Boekhoudbaar

on:
  push:
    branches:
      - main
      - claude/google-forms-accounting-system-0N1Mx
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Annuleer oudere runs op dezelfde branch (geen dubbele deploys)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── JOB 1: LINT ──────────────────────────────────────────────
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Installeer dependencies
        run: npm ci
        env:
          HUSKY: '0'
      - name: ESLint
        run: npm run lint

  # ── JOB 2: TESTS ─────────────────────────────────────────────
  test:
    name: Tests (Jest)
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Installeer dependencies
        run: npm ci
        env:
          HUSKY: '0'
      - name: Jest
        run: npm test

  # ── JOB 3: DEPLOY (alleen op production branches) ────────────
  deploy:
    name: Deploy naar Apps Script
    runs-on: ubuntu-latest
    needs: [lint, test]
    # Alleen deployen vanuit production branches, niet vanuit PR's
    if: github.event_name != 'pull_request'
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # Job-level env zodat step-level `if: env.X != ''` wél evalueert
      # (step-level `env` is niet beschikbaar voor de step's eigen if-conditie).
      LICENCE_DEPLOYMENT_ID: ${{ secrets.LICENCE_DEPLOYMENT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Volledige history nodig om diff tussen HEAD en main^ te zien
          # (voor licence-server-paths-detectie).
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: clasp installeren
        run: npm install -g @google/clasp

      # ── Detect of de licence-server is gewijzigd ───────────────
      # Apps Script heeft een HARD CAP van 200 versies per project.
      # Elke `clasp deploy` maakt een nieuwe versie-snapshot — er is
      # geen "update in place" mogelijk. Daarom alleen deployen wanneer
      # de code in licence-server/** is veranderd. Wijziging in src/,
      # website/, tests/ of docs triggert geen licence-deploy.
      - name: Detect licence-server changes
        id: licence-diff
        run: |
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            CHANGED=$(git diff --name-only HEAD~1 HEAD -- licence-server/ | wc -l)
          else
            # Eerste commit op branch — deploy voor de zekerheid
            CHANGED=1
          fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          if [ "$CHANGED" -gt 0 ]; then
            echo "📝 licence-server/ gewijzigd ($CHANGED bestand(en)) → deploy nodig"
          else
            echo "✓ licence-server/ ongewijzigd → deploy overslaan (versie-budget besparen)"
          fi

      - name: Projectafhankelijkheden installeren
        run: npm ci

      - name: Credentials normaliseren en token vernieuwen
        env:
          CLASP_CREDENTIALS: ${{ secrets.CLASP_CREDENTIALS }}
        run: |
          python3 << 'PYTHON'
          import json, os, sys, time, urllib.request, urllib.parse

          raw = os.environ.get('CLASP_CREDENTIALS', '').strip()
          if not raw:
              print("::error title=Secret ontbreekt::CLASP_CREDENTIALS is leeg. Ga naar Settings → Secrets → Actions en voeg toe.")
              sys.exit(1)

          try:
              creds, _ = json.JSONDecoder().raw_decode(raw)
          except json.JSONDecodeError as e:
              print(f"::error title=Ongeldige JSON::JSON-fout: {e}.")
              sys.exit(1)

          # Normaliseer naar clasp-formaat
          # Formaat A: {"tokens": {"default": {...}}} — gcloud / nieuwe clasp
          if 'tokens' in creds and 'default' in creds.get('tokens', {}):
              d = creds['tokens']['default']
              token_data    = { "access_token": d.get("access_token",""), "refresh_token": d.get("refresh_token",""),
                                "token_type": d.get("token_type","Bearer"), "expiry_date": d.get("expiry_date",0) }
              oauth_settings = { "clientId": d.get("client_id",""), "clientSecret": d.get("client_secret",""),
                                 "redirectUri": "http://localhost" }
          # Formaat B: standaard clasp {"token": {...}}
          elif 'token' in creds:
              token_data    = creds['token']
              oauth_settings = creds.get('oauth2ClientSettings', {})
          else:
              print(f"::error title=Onbekend formaat::Sleutels: {list(creds.keys())}. Verwacht 'token' of 'tokens'.")
              sys.exit(1)

          refresh_token  = token_data.get('refresh_token', '')
          client_id      = oauth_settings.get('clientId', '')
          client_secret  = oauth_settings.get('clientSecret', '')

          if not refresh_token:
              print("::error title=Geen refresh_token::CLASP_CREDENTIALS mist een refresh_token. Zie INFRA.md §Clasp.")
              sys.exit(1)

          # Vernieuw access_token via Google OAuth2 — zodat CI nooit faalt door een verlopen token
          new_access  = token_data.get('access_token', '')
          new_expiry  = token_data.get('expiry_date', 0)

          if client_id and client_secret:
              try:
                  body = urllib.parse.urlencode({
                      'client_id': client_id, 'client_secret': client_secret,
                      'refresh_token': refresh_token, 'grant_type': 'refresh_token',
                  }).encode()
                  req = urllib.request.Request('https://oauth2.googleapis.com/token', data=body, method='POST')
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      new_token = json.loads(resp.read())
                  new_access = new_token['access_token']
                  new_expiry = int(time.time() * 1000) + new_token.get('expires_in', 3600) * 1000
                  print(f"✓ Access token vernieuwd (geldig {new_token.get('expires_in',3600)}s)")
              except Exception as e:
                  print(f"::warning::Token-refresh mislukt ({e}) — clasp probeert zelf te vernieuwen")
          else:
              # Geen OAuth-app-credentials in secret — clasp gebruikt ingebouwde credentials
              print("ℹ️  Geen clientId/clientSecret in secret; clasp vernieuwt intern (standaard clasp-login)")

          clasp_creds = {
              "token": { "access_token": new_access, "refresh_token": refresh_token,
                         "token_type": "Bearer", "expiry_date": new_expiry },
              "oauth2ClientSettings": oauth_settings,
              "isLocalCreds": False
          }

          path = os.path.expanduser('~/.clasprc.json')
          with open(path, 'w') as f:
              json.dump(clasp_creds, f)
          os.chmod(path, 0o600)
          print("✓ ~/.clasprc.json geschreven met vers token")
          PYTHON

      - name: clasp push (klant-kopie)
        # FIX F-RED-506: NODE_TLS_REJECT_UNAUTHORIZED verwijderd (stelde clasp-OAuth-token bloot aan MITM)
        run: |
          echo "clasp versie: $(clasp --version)"
          echo "Script ID:    $(python3 -c "import json; print(json.load(open('.clasp.json'))['scriptId'])")"

          set +e
          OUTPUT=$(clasp push --force 2>&1)
          EXIT=$?
          set -e
          echo "$OUTPUT"

          if [ $EXIT -ne 0 ]; then
            if echo "$OUTPUT" | grep -qi "login\|auth\|401\|403\|credential"; then
              echo "::error title=Authenticatie mislukt::Vernieuw CLASP_CREDENTIALS in GitHub Settings → Secrets → Actions."
            else
              echo "::error title=clasp push mislukt (klant-kopie)::$(echo "$OUTPUT" | head -3 | tr '\n' ' ')"
            fi
            exit $EXIT
          fi
          echo "✅ Klant-kopie gepusht"
          echo "ℹ️  Klant-kopie is container-bound aan template-sheet; geen /exec URL."
          echo "    Nieuwe klanten krijgen automatisch de nieuwste code bij kopiëren."
          echo "    Bestaande klanten houden hun eigen snapshot (by design)."

      - name: clasp push (licentieserver)
        # FIX F-RED-506: NODE_TLS_REJECT_UNAUTHORIZED verwijderd (TLS-verificatie hoort aan te staan)
        run: |
          cd licence-server
          echo "Script ID:    $(python3 -c "import json; print(json.load(open('.clasp.json'))['scriptId'])")"

          set +e
          OUTPUT=$(clasp push --force 2>&1)
          EXIT=$?
          set -e
          echo "$OUTPUT"

          if [ $EXIT -ne 0 ]; then
            echo "::error title=clasp push mislukt (licentieserver)::$(echo "$OUTPUT" | head -3 | tr '\n' ' ')"
            exit $EXIT
          fi
          echo "✅ Licentieserver gepusht (HEAD)"
          echo ""
          echo "⚠️  LET OP: clasp push update alleen de HEAD van de licentieserver."
          echo "    De live /exec URL blijft op de vorige deployed version totdat er"
          echo "    een nieuwe versie wordt gepubliceerd. Zie DEPLOYMENT.md voor de"
          echo "    eenmalige handmatige stap, of stel LICENCE_DEPLOYMENT_ID in als"
          echo "    secret om dit automatisch te doen."

      - name: clasp deploy (licentieserver — alleen bij licence-server/ changes)
        # Dubbele guard: secret moet gezet zijn EN licence-server/ moet
        # gewijzigd zijn in deze commit. Voorheen draaide deploy bij ELKE
        # commit op main → 200-versie-limiet binnen 6 maanden gehaald.
        if: ${{ env.LICENCE_DEPLOYMENT_ID != '' && steps.licence-diff.outputs.changed != '0' }}
        # FIX F-RED-506: NODE_TLS_REJECT_UNAUTHORIZED verwijderd
        run: |
          cd licence-server

          # Versie-budget waarschuwing: tel huidige versies, waarschuw bij
          # >180 zodat owner tijd heeft om oude te verwijderen voordat de
          # 200-limiet hard hit (= disabled "Implementeren"-knop = geen fixes
          # meer live krijgen).
          set +e
          VERSIES_OUTPUT=$(clasp versions 2>&1)
          set -e
          VERSIES_COUNT=$(echo "$VERSIES_OUTPUT" | grep -cE '^[0-9]+ - ' || echo 0)
          if [ "$VERSIES_COUNT" -gt 180 ]; then
            echo "::warning title=Apps Script versie-budget bijna op ($VERSIES_COUNT/200)::Ruim ongebruikte versies op via Apps Script → Versies (klok-icoontje). Zonder ruimte breekt de volgende deploy."
          fi

          set +e
          OUTPUT=$(clasp deploy --deploymentId "$LICENCE_DEPLOYMENT_ID" --description "CI auto-deploy $(date -u +%Y-%m-%dT%H:%M:%SZ)" 2>&1)
          EXIT=$?
          set -e
          echo "$OUTPUT"
          if [ $EXIT -ne 0 ]; then
            if echo "$OUTPUT" | grep -qi "version limit\|too many versions\|maximum"; then
              echo "::error title=200-versie-limiet bereikt::Open Apps Script → Versies (klok-icoontje) en verwijder 100+ oude versies. Daarna handmatig deployen via Apps Script UI."
            else
              echo "::warning title=Automatische deploy mislukt::Live /exec URL is nog niet bijgewerkt. Deploy handmatig via Apps Script UI."
            fi
          else
            echo "✅ Live /exec URL bijgewerkt (versie $((VERSIES_COUNT + 1))/200)"
          fi

      - name: Licence deploy overgeslagen — toon waarom
        if: ${{ env.LICENCE_DEPLOYMENT_ID != '' && steps.licence-diff.outputs.changed == '0' }}
        run: |
          echo "ℹ️  licence-server/ is niet gewijzigd in deze commit."
          echo "    clasp deploy overgeslagen om Apps Script versie-budget te sparen."
          echo "    Vorige live versie blijft actief op de /exec URL."

      - name: Cloudflare cache purge (optioneel)
        if: ${{ env.CF_API_TOKEN != '' && env.CF_ZONE_ID != '' }}
        run: |
          HTTP=$(curl -s -o /tmp/cf_purge.json -w "%{http_code}" -X POST \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          cat /tmp/cf_purge.json
          if [ "$HTTP" = "200" ]; then
            echo "✅ Cloudflare edge-cache geleegd"
          else
            echo "::warning title=CF cache purge mislukt (HTTP $HTTP)::Controleer CF_API_TOKEN en CF_ZONE_ID secrets."
          fi

      # ── SMOKE TEST: licentieserver bereikbaar + healthy?
      # Voorkomt dat een geslaagde deploy stilletjes een broken endpoint achterlaat.
      - name: Smoke-test licentieserver
        if: ${{ env.LICENCE_DEPLOYMENT_ID != '' }}
        env:
          LICENCE_EXEC_URL: ${{ secrets.LICENCE_EXEC_URL }}
        run: |
          if [ -z "$LICENCE_EXEC_URL" ]; then
            echo "::warning title=LICENCE_EXEC_URL ontbreekt::Stel deze secret in voor automatische health-check (de /exec URL van je licentieserver-deploy)."
            exit 0
          fi
          HTTP=$(curl -s -L -o /tmp/health.json -w "%{http_code}" \
            "${LICENCE_EXEC_URL}?actie=health")
          BODY=$(cat /tmp/health.json | head -c 500)
          echo "Status: $HTTP — Body: $BODY"
          if [ "$HTTP" != "200" ]; then
            echo "::error title=Licentieserver onbereikbaar::HTTP $HTTP. Recente deploy mogelijk broken — check Apps Script Executions log."
            exit 1
          fi
          if echo "$BODY" | grep -qi '"ok"\s*:\s*true\|"healthy"\s*:\s*true'; then
            echo "✅ Licentieserver healthy"
          else
            echo "::warning title=Licentieserver bereikbaar maar geen ok-response::Body: $BODY"
          fi

      # ── FAIL-NOTIFICATION via email naar owner als hierboven faalt
      - name: E-mail bij deploy-falen
        if: failure()
        env:
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
        run: |
          if [ -z "$OWNER_EMAIL" ]; then exit 0; fi
          echo "::warning::Deploy faalde. OWNER_EMAIL secret aanwezig maar GitHub Actions kan niet direct mailen — gebruik notification-rules in GitHub of een third-party action."
          echo "Tip: stel een 'Workflow runs' notification in via GitHub → Settings → Notifications → Actions → Failures only."

